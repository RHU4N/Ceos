name: CI - ceosFront
on:
  push:
    branches: [ main, master, devops ]
  pull_request:
    branches: [ main, master, devops ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      REACT_APP_API_LOGIN_URL: /api/login
      REACT_APP_API_MATH_URL: https://mathapi-ceos.azurewebsites.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ceosFront-build
          path: build
          if-no-files-found: error
          retention-days: 3
  # Vercel's Git integration owns deployments; do not also trigger a deploy hook.
  infra-tests:
    name: Infra Tests - ceosFront (serve build + smoke)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ceosFront-build
          path: build
      - name: Serve built site and smoke-check
        shell: bash
        run: |
          test -f build/index.html
          python3 -m http.server 5000 --bind 127.0.0.1 --directory build >/tmp/serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:5000/ -o /tmp/index.html
          grep -q '<div id="root">' /tmp/index.html
