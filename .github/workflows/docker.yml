name: Docker smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test isolated container
        env:
          CEOS_DOCKER_IMAGE_ARCHIVE: ${{ runner.temp }}/ceos-a02-web.tar
        run: bash scripts/docker-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ceos-a02-runtime-scan
          path: ${{ runner.temp }}/ceos-a02-web.tar
          retention-days: 1
          if-no-files-found: error
