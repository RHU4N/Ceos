name: Security - npm audit (ceosFront)

on:
  push:
    branches: [ devops, main, master ]
  pull_request:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci

      - name: Run npm audit (report)
        run: |
          npm audit --json > npm-audit.json || true
          jq -e '.metadata.vulnerabilities' npm-audit.json
          echo 'Audit findings are reported; this workflow is not a vulnerability gate.'

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
